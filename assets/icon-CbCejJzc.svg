<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1f2d47" stroke-width="3" />

  <!-- Background decorative grid / circuit elements -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#162338" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#131e30" stroke-width="1" />

  <!-- Shield Shape Glow Behind -->
  <path d="M 256 90 L 376 138 C 376 260 256 360 256 360 C 256 360 136 260 136 138 Z" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Outer Shield Border -->
  <path d="M 256 96 L 370 142 C 370 258 256 352 256 352 C 256 352 142 258 142 142 Z" fill="#0d1829" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Tech Shield Pattern -->
  <path d="M 256 120 L 348 158 C 348 245 256 324 256 324 C 256 324 164 245 164 158 Z" fill="#09101d" stroke="#1d2f4d" stroke-width="3" />

  <!-- Secure Lock & Payment Token Icon -->
  <rect x="220" y="210" width="72" height="60" rx="12" fill="url(#shieldGrad)" />
  <path d="M 234 210 V 186 C 234 173.85 243.85 164 256 164 C 268.15 164 278 173.85 278 186 V 210" fill="none" stroke="#00e599" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="236" r="6" fill="#070a12" />
  <path d="M 256 242 V 254" stroke="#070a12" stroke-width="4" stroke-linecap="round" />

  <!-- Biometric / Tech Pulse Checkmark Line -->
  <path d="M 190 286 L 226 286 L 242 272 L 256 304 L 270 286 L 322 286" fill="none" stroke="#00e599" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- EIE Logo Monogram below shield -->
  <text x="256" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">EIE</text>
  <text x="256" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00e599" letter-spacing="3" text-anchor="middle">SECUR PAYMENT</text>
</svg>
