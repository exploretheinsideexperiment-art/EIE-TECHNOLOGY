<!doctype html>
<html lang="en" class="dark" style="background-color: #090d16; color: #e1e7f5;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EIE-Technology | Explore the Inside Experiment-Technology (Created by Vipul)</title>
    <meta name="description" content="Explore the Inside Experiment-Technology (Created by Vipul) - Production-ready payment and protected digital-link delivery platform with one-time token security." />
    <meta property="og:title" content="EIE-Technology | Explore the Inside Experiment-Technology" />
    <meta property="og:description" content="Explore the Inside Experiment-Technology (Created by Vipul) - Production-ready payment and protected digital-link delivery platform with one-time token security." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Normalize GitHub Pages path with trailing slash so relative assets always resolve correctly -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Prevent Stale HTML Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EIE-Tech" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="module" src="./registerSW.js"></script>

    <style>
      html, body {
        background-color: #090d16 !important;
        color: #e1e7f5;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .eie-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #090d16;
        gap: 16px;
      }
      .eie-spin-ring {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(0, 229, 153, 0.2);
        border-top-color: #00e599;
        border-radius: 50%;
        animation: eie-spin 0.8s linear infinite;
      }
      @keyframes eie-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#090d16] text-[#e1e7f5] antialiased selection:bg-[#00e599]/30 selection:text-white" style="background-color: #090d16; color: #e1e7f5;">
    <div id="root">
      <div class="eie-preloader">
        <div class="eie-spin-ring"></div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.15em; color: #00e599; font-family: monospace;">
          EIE-TECHNOLOGY SECURE ACCESS
        </div>
        <div id="eie-preload-msg" style="font-size: 11px; color: #7084a3; text-align: center; max-width: 280px;">
          Loading payment environment...
        </div>
      </div>
    </div>

    <!-- Development entry point for Vite dev server -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static hosting recovery watchdog and GitHub Pages root fallback -->
    <script>
      (function() {
        var isLocalDev = window.location.port === '3000' || 
                         window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1';

        // Watchdog: If preloader persists for > 3.5s due to stale browser cache or unmounted state
        setTimeout(function() {
          if (window.__eie_mounted) return;
          var msgEl = document.getElementById('eie-preload-msg');
          if (msgEl) {
            msgEl.innerHTML = '<span style="color:#38bdf8;font-size:12px;font-weight:600;">Updating app cache...</span><br>' +
              '<button id="eie-refresh-btn" onclick="window.__eie_refresh_fresh()" style="margin-top:12px;padding:9px 18px;background:#00e599;color:#070b13;border:none;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,229,153,0.35);">' +
              'Tap to Load App / नया वर्ज़न खोलें ↻' +
              '</button>';
          }
        }, 3500);

        window.__eie_refresh_fresh = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if (window.caches) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) caches.delete(names[i]);
            });
          }
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          window.location.href = window.location.href.split('#')[0] + sep + '_fresh=' + Date.now();
        };

        if (!isLocalDev) {
          function bootStaticProd() {
            // If already mounted or Vite's script is present, do nothing
            if (window.__eie_mounted || document.querySelector('script[src*="assets/index-"]')) return;
            var rootEl = document.getElementById('root');
            if (rootEl && rootEl.querySelector('.eie-preloader')) {
              var cssFile = "index-DWfYOrKN.css";
              var jsFile = "index-BjON5SjN.js";
              if (cssFile && cssFile.indexOf('__') === -1 && !document.querySelector('link[href*="' + cssFile + '"]')) {
                var l = document.createElement('link');
                l.rel = 'stylesheet';
                l.crossOrigin = 'anonymous';
                l.href = './assets/' + cssFile;
                document.head.appendChild(l);
              }
              if (jsFile && jsFile.indexOf('__') === -1 && !document.querySelector('script[src*="' + jsFile + '"]')) {
                var s = document.createElement('script');
                s.type = 'module';
                s.crossOrigin = 'anonymous';
                s.src = './assets/' + jsFile;
                document.body.appendChild(s);
              }
            }
          }
          window.addEventListener('error', function(e) {
            if (e.filename && (e.filename.indexOf('.tsx') !== -1 || e.filename.indexOf('main.tsx') !== -1)) {
              bootStaticProd();
            }
          }, true);
          setTimeout(bootStaticProd, 500);
        }
      })();
    </script>
  </body>
</html>
